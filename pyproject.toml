
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "german-property-energy-management"
version = "0.1.0"
description = "An AI-powered energy monitoring, forecasting, and optimization prototype for German properties."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "numpy",
    "plotly",
    "streamlit",
    "scikit-learn",
    "statsmodels",
    "python-dotenv",
    "Flask>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "PyMySQL[rsa]>=1.1,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
pythonpath = ["src"]
markers = ["integration: requires a disposable MySQL database"]

[tool.setuptools.package-data]
"backend.web" = ["templates/*.html"]
